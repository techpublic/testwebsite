<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Coffee Delivery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 50px;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        .btn {
            background-color: #ff6f00;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #e65c00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>☕ Quantum Coffee</h1>
        <p>We teleport the freshest brew directly to your desk in milliseconds.</p>
        
        <button class="btn" onclick="alert('Order received! Espresso is teleporting to your location.')">
            Order Espresso ($3)
        </button>
        
        <button class="btn" onclick="alert('Order received! Flat White is teleporting to your location.')">
            Order Flat White ($4)
        </button>

        <p><small>Status: System Online - Ready for GitHub Pages Test</small></p>
    </div>

</body>
</html>
